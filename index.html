const names=['Вертикальный','Горизонтальный','Двойной','Для питомца'], icons=['♟','▰','♟♟','♥'], stones=['Габбро-диабаз','Елизовский гранит','Мансуровский гранит','Балтик Грин гранит','Ала Носкау гранит','Возрождение','Карельский гранит','Мрамор Коелга','Дымовский гранит','Капустинский гранит','Лабрадорит','Сюскюянсаари','Покостовский гранит'], state={shape:1,stone:0,size:1,angle:'volume',more:false,extras:[],style:'Классический',name:'',birth:'',death:''};const step=document.querySelector('#step');function persist(){}function render(){document.querySelectorAll('.angle').forEach(b=>b.classList.toggle('active',b.dataset.angle===state.angle));document.querySelector('.hint').textContent=state.angle==='front'?'Вид спереди. Посмотрите на форму памятника и расположение надписи.':state.angle==='back'?'Приближённый вид надписи. Введите имя и даты справа, чтобы увидеть их на памятнике.':'Объёмный предпросмотр. Поверните памятник мышью или пальцем. Рисунок камня и оформление уточним в эскизе.';document.querySelectorAll('.engraving').forEach(x=>x.textContent=[state.name,state.birth,state.death].filter(Boolean).join(' · '));let scene=document.querySelector('.scene');scene.className='scene '+['vertical','horizontal','double','pet'][state.shape]+(state.angle==='front'?' is-front':state.angle==='back'?' is-text':' is-volume');document.querySelectorAll('.slab,.base').forEach(x=>{x.style.backgroundImage=`url('${atlas}')`;x.style.backgroundSize='400% 400%';x.style.backgroundPosition=`${(state.stone%4)*100/3}% ${Math.floor(state.stone/4)*100/3}%`});step.innerHTML='<section class="section"><h2>Форма памятника</h2><div class="choices">'+names.map((x,i)=>`<button class="choice ${state.shape===i?'selected':''}" data-shape="${i}" aria-pressed="${state.shape===i}"><span class="form-mini form-${i}" aria-hidden="true"><i></i><i></i></span><span>${x}</span></button>`).join('')+'</div></section><section class="section material-section"><h2>Материал</h2><div class="material-row"><span class="selected-stone">'+stones[state.stone]+'</span><button type="button" class="material-cta" disabled aria-label="Рассмотреть камни — скоро">Рассмотреть камни <span aria-hidden="true">↗</span></button></div><div class="stonechoices">'+stones.slice(0,state.more?stones.length:6).map((x,i)=>`<button class="stone-option ${state.stone===i?'selected':''}" data-stone="${i}" aria-pressed="${state.stone===i}" title="${x}" aria-label="${x}"><span class="swatch" style="${stoneTile(i)}"></span></button>`).join('')+`<button id="more" class="stone-option more-option" aria-expanded="${state.more}" aria-label="${state.more?'Показать меньше':'Ещё камни'}"><span class="swatch more-swatch">${state.more?'−':'+'+(stones.length-6)}</span></button>`+'</div><div class="smalllabel">Размер памятника</div>'+'<div class="sizechoices">'+['80×40 см','100×50 см','120×60 см'].map((x,i)=>`<button class="choice ${state.size===i?'selected':''}" data-size="${i}" aria-pressed="${state.size===i}">${x}</button>`).join('')+'</div></section><section class="section"><h2>Надпись и даты</h2><label class="smalllabel" for="memname">Фамилия, имя, отчество</label><input class="field" id="memname" placeholder="Фамилия, имя, отчество" value="'+xml(state.name)+'"><div class="fields" style="margin-top:14px"><label>Дата рождения<input class="field" id="birth" placeholder="дд.мм.гггг" value="'+xml(state.birth)+'"></label><label>Дата ухода<input class="field" id="death" placeholder="дд.мм.гггг" value="'+xml(state.death)+'"></label></div><p class="fine">Оформление надписи уточним при подготовке эскиза.</p></section><section class="section"><h2>Дополнительно</h2><div class="extras">'+[['Цветник','Оформление у основания'],['Оградка','Граница участка'],['Плитка','Покрытие участка'],['Скамья','Место для отдыха'],['Вазон','Место для цветов'],['Кресты','Символ в форме или оформлении'],['Резные элементы','Орнамент и рельеф в камне'],['Скульптуры','Образ с личным смыслом']].map(([x,desc],i)=>`<label class="extra"><input type="checkbox" data-extra="${x}" ${state.extras.includes(x)?'checked':''}><span class="extra-pic" style="${accessoryTile(i)}" aria-hidden="true"></span><span><b>${x}</b><small>${desc}</small></span></label>`).join('')+'</div></section>';persist()}function xml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]))}
document.querySelectorAll('.angle').forEach(b=>b.onclick=()=>{state.angle=b.dataset.angle;document.querySelectorAll('.angle').forEach(x=>x.classList.toggle('active',x===b));render()});step.addEventListener('click',e=>{let t=e.target.closest('button');if(!t)return;if(t.dataset.shape!==undefined)state.shape=+t.dataset.shape;if(t.dataset.stone!==undefined)state.stone=+t.dataset.stone;if(t.dataset.size!==undefined)state.size=+t.dataset.size;if(t.dataset.style)state.style=t.dataset.style;if(t.id==='more'){state.more=!state.more;render();return;}render()});step.addEventListener('change',e=>{if(e.target.dataset.extra){let v=e.target.dataset.extra;state.extras=e.target.checked?[...new Set([...state.extras,v])]:state.extras.filter(x=>x!==v);persist()}});step.addEventListener('input',e=>{if(e.target.id==='memname')state.name=e.target.value;if(e.target.id==='birth')state.birth=e.target.value;if(e.target.id==='death')state.death=e.target.value;document.querySelectorAll('.engraving').forEach(x=>x.textContent=[state.name,state.birth,state.death].filter(Boolean).join(' · '));persist()});document.querySelector('#reset').onclick=()=>{localStorage.removeItem('memorial-builder');Object.assign(state,{shape:1,stone:0,size:1,tab:0,angle:'volume',more:false,extras:[],style:'Классический',name:'',birth:'',death:''});render();toast('Выбор сброшен')};document.querySelectorAll('.open-modal').forEach(b=>b.onclick=()=>document.querySelector('#modal').style.display='grid');document.querySelector('#close').onclick=()=>document.querySelector('#modal').style.display='none';document.querySelector('#send').onclick=()=>{let phone=document.querySelector('#contactPhone').value.trim(),digits=phone.replace(/\D/g,'');if(digits.length<10||digits.length>15){document.querySelector('#contactPhone').setCustomValidity('Введите корректный номер телефона');document.querySelector('#contactPhone').reportValidity();return}document.querySelector('#contactPhone').setCustomValidity('');if(!document.querySelector('#contactConsent').checked){toast('Для черновика отметьте согласие на обработку данных');return}let box=document.querySelector('.modalbox'),note=box.querySelector('.local-draft');if(!note){note=document.createElement('p');note.className='local-draft';box.append(note)}note.textContent='Локальное демо: запрос не отправлен. Черновик обращения с телефоном '+phone+' подготовлен на этой странице.';document.querySelector('#send').textContent='Понятно'};let timer;document.querySelector('.scene').addEventListener('pointermove',e=>{if(e.buttons){let r=e.currentTarget.getBoundingClientRect();document.querySelector('.monument').style.transform=`rotateY(${(e.clientX-r.left-r.width/2)/8}deg) rotateX(${-(e.clientY-r.top-r.height/2)/15}deg)`}});function xml(v){return String(v).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&apos;'}[c]))}function toast(s){let t=document.querySelector('#toast');t.textContent=s;t.style.display='block';clearTimeout(timer);timer=setTimeout(()=>t.style.display='none',2400)}let saved=null;let params=new URLSearchParams(location.search);if(params.has('form')&&!saved){let f=params.get('form');state.shape=Math.max(0,['vertical','horizontal','double','pet'].indexOf(f));state.stone=+(params.get('stone')||0);state.size=+(params.get('size')||1)}render();
const cta=document.querySelector('.bottom .pill'); if(window.matchMedia('(max-width:900px)').matches && 'IntersectionObserver' in window){const io=new IntersectionObserver(([entry])=>{cta.classList.toggle('mobile-docked',!entry.isIntersecting && entry.boundingClientRect.top>innerHeight)}, {threshold:0});io.observe(document.querySelector('.bottom'));}
